<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desmos SAT Calculator</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #calculator {
      width: 100%;
      height: 100%;
    }
    #offline-msg {
      display: none;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 32px 24px;
      text-align: center;
      color: #0F172A;
    }
    #offline-msg h2 {
      font-size: 1.1rem;
      margin: 0 0 8px 0;
    }
    #offline-msg p {
      font-size: 0.9rem;
      color: #475569;
      margin: 0;
    }
  </style>
  <!-- 1. Try local offline script first; if unavailable and online, loads official API.
       Final failure shows an offline message instead of an iframe to desmos.com
       (which can never load with zero internet). -->
  <script src="/desmos-calculator.js" onerror="loadCdnScript()"></script>
  <script>
    function loadCdnScript() {
      if (!navigator.onLine) {
        showOfflineMessage();
        return;
      }
      const script = document.createElement('script');
      script.src = 'https://www.desmos.com/api/v1.9/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6';
      script.onload = initDesmos;
      script.onerror = showOfflineMessage;
      document.head.appendChild(script);
    }

    let calcInstance = null;

    function initDesmos() {
      if (typeof Desmos !== 'undefined' && Desmos.GraphingCalculator) {
        const elt = document.getElementById('calculator');
        calcInstance = Desmos.GraphingCalculator(elt, {
          degreeMode: true,
          expressions: true,
          keypad: true,
          settingsMenu: true,
          zoomButtons: true,
          border: false,
          pointsOfInterest: true,
          trace: true,
          pasteGraphLink: false,
          restrictedMode: false
        });
      } else {
        showOfflineMessage();
      }
    }

    function showOfflineMessage() {
      const calcDiv = document.getElementById('calculator');
      const msg = document.getElementById('offline-msg');
      calcDiv.style.display = 'none';
      msg.style.display = 'block';
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof Desmos !== 'undefined') {
        initDesmos();
      }
    });

    window.addEventListener('resize', () => {
      if (calcInstance) {
        calcInstance.resize();
      }
    });
  </script>
</head>
<body>
  <div id="calculator"></div>
  <div id="offline-msg">
    <h2>Calculator unavailable</h2>
    <p>The graphing calculator could not be loaded. Check your connection and reopen it.</p>
  </div>
</body>
</html>
